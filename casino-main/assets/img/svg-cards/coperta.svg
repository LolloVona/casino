<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420">
  <defs>
    <linearGradient id="cardBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8dc"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#fff8dc"/>
    </linearGradient>

    <pattern id="diamondPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="6" y="6" width="8" height="8" transform="rotate(45 10 10)"
            fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
    </pattern>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ombra -->
  <rect x="22" y="24" width="256" height="372" rx="20" fill="#000000" opacity="0.08"/>

  <g filter="url(#shadow)">
    <!-- Base -->
    <rect x="20" y="20" width="260" height="380" rx="20" fill="#ffffff"/>

    <!-- Sfondo -->
    <rect x="30" y="30" width="240" height="360" rx="16" fill="url(#cardBack)"/>

    <!-- Bordo oro -->
    <rect x="38" y="38" width="224" height="344" rx="13"
          fill="none" stroke="url(#gold)" stroke-width="4"/>

    <!-- Bordo interno -->
    <rect x="50" y="50" width="200" height="320" rx="10"
          fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85"/>

    <!-- Pattern -->
    <rect x="56" y="56" width="188" height="308" rx="8" fill="url(#diamondPattern)"/>

    <!-- TESTO SOPRA (pulito, isolato) -->
    <text x="150" y="85" text-anchor="middle"
          font-family="Georgia, serif"
          font-size="26"
          fill="url(#gold)"
          letter-spacing="3">
      BLACKJACK
    </text>

    <!-- Simbolo centrale -->
    <g transform="translate(150 215)">
      <ellipse cx="0" cy="0" rx="60" ry="80"
               fill="none" stroke="url(#gold)" stroke-width="4"/>

      <!-- Picche -->
      <path d="M0 -30
               C-10 -15 -24 -10 -24 2
               C-24 12 -16 18 -6 18
               C-6 10 -3 6 0 3
               C3 6 6 10 6 18
               C16 18 24 12 24 2
               C24 -10 10 -15 0 -30Z"
            fill="url(#gold)"/>
      <rect x="-3" y="18" width="6" height="16" rx="2" fill="url(#gold)"/>
    </g>

    <!-- TESTO SOTTO (separato) -->
    <text x="150" y="345" text-anchor="middle"
          font-family="Georgia, serif"
          font-size="14"
          fill="#ffffff"
          opacity="0.8"
          letter-spacing="2">
      CASINO CARD
    </text>

  </g>
</svg>